<body>
<header><div class="wrap nav">
<a class="logo" href="#top">Aarohi</a>
<nav><a href="#career">Career</a><a href="#wellness">AshaCare</a><a href="#privacy">Privacy</a><span id="authnav"></span></nav>
</div></header>
<main class="wrap authpage">
<div class="card authcard">
<h1>Create your account</h1>
<p class="sub">Start your personal plan, roadmap and progress.</p>
<form id="authform" data-mode="signup" novalidate>
<label for="name">Your name</label>
<input id="name" name="name" type="text" autocomplete="name" required >
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" required >
<label for="password">Password (8+ characters)</label>
<input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
<label for="confirm">Confirm password</label>
<input id="confirm" name="confirm" type="password" autocomplete="new-password" required >
<p class="autherr" id="autherr" role="alert"></p>
<button class="cta" type="submit">Create account</button>
</form>
<p class="altlink">Already have an account? <a href="login.html">Log in</a></p>
</div>
</main>
<script src="auth.js"></script>
</body>
</html>
