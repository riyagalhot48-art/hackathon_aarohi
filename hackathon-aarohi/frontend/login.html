<body>
<header><div class="wrap nav">
<a class="logo" href="#top">Aarohi</a>
<nav><a href="#career">Career</a><a href="#wellness">AshaCare</a><a href="#privacy">Privacy</a><span id="authnav"></span></nav>
</div></header>
<main class="wrap authpage">
<div class="card authcard">
<h1>Welcome back</h1>
<p class="sub">Log in to pick up where you left off.</p>
<form id="authform" data-mode="login" novalidate>
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" required >
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required >
<p class="autherr" id="autherr" role="alert"></p>
<button class="cta" type="submit">Log in</button>
</form>
<p class="altlink">New here? <a href="signup.html">Create an account</a></p>
</div>
</main>
<script src="auth.js"></script>
</body>
</html>
